<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Hermes · Files v2</title>
<link rel="stylesheet" href="matrix-system.css"/>
<link rel="stylesheet" href="primary-nav-v2.css"/>
<style>.nav { background: transparent !important; border: none !important; padding: 0 !important; }</style>
<style>
  html, body { height: 100%; }
  body { background: var(--m-bg); }
  :root { --accent: var(--m-green-500); --rowpad: 5px; }

  .shell {
    display: grid;
    grid-template-columns: 232px 340px 1fr;
    height: 100vh; overflow: hidden;
    transition: grid-template-columns var(--m-dur-base) var(--m-ease-out);
  }
  .shell.tree-collapsed { grid-template-columns: 232px 46px 1fr; }
  .nav { display: block; min-width: 0; }

  /* ── explorer panel ─────────────────────────────────────── */
  .exp { background: var(--m-panel); border-right: 1px solid var(--m-border); display: grid; grid-template-rows: auto auto auto auto 1fr auto; overflow: hidden; min-width:0; }
  .exp-head { display: flex; align-items: center; gap: 8px; padding: 12px 12px 10px; border-bottom: 1px solid var(--m-border-subtle); }
  .exp-head h3 { margin: 0; font: 600 11px var(--m-font-mono); text-transform: uppercase; letter-spacing: .24em; color: var(--m-text-strong); }
  .exp-head .ct { font: 500 10px var(--m-font-mono); color: var(--m-text-faint); }
  .exp-head .sp { flex: 1; }
  .exp-head .actions { display: flex; gap: 2px; }

  .ico-btn { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: var(--m-radius-md); color: var(--m-text-muted); cursor: pointer; border: 1px solid transparent; transition: all var(--m-dur-fast) var(--m-ease-out); position: relative; }
  .ico-btn:hover { background: var(--m-fill-subtle); color: var(--accent); border-color: var(--m-border-subtle); }
  .ico-btn.active { background: var(--m-fill); color: var(--accent); border-color: var(--m-border); }
  .ico-btn:disabled { opacity:.35; cursor: default; }

  /* quick-jump trigger */
  .qjump { margin: 10px 12px 0; display:flex; align-items:center; gap:9px; padding: 8px 11px; border:1px solid var(--m-border); border-radius: var(--m-radius-md); background: var(--m-bg-deep); cursor:pointer; color: var(--m-text-muted); transition: all var(--m-dur-fast) var(--m-ease-out); }
  .qjump:hover { border-color: var(--accent); color: var(--m-text); box-shadow: var(--m-glow-sm); }
  .qjump .lbl { flex:1; font: 500 12px var(--m-font-mono); }
  .qjump kbd { font: 600 10px var(--m-font-mono); padding: 2px 6px; border:1px solid var(--m-border-subtle); border-radius: 4px; color: var(--m-text-faint); background: var(--m-panel); letter-spacing:.06em; }

  .exp-search { padding: 8px 12px 8px; }
  .srch { display:flex; align-items:center; gap:8px; padding:7px 10px; border:1px solid var(--m-border); border-radius: var(--m-radius-md); background: var(--m-bg-deep); transition: all var(--m-dur-fast) var(--m-ease-out); }
  .srch:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,255,65,.14); }
  .srch input { flex:1; background:transparent; border:none; outline:none; color: var(--m-text); font: 500 12.5px var(--m-font-mono); min-width:0; }
  .srch input::placeholder { color: var(--m-text-faint); }
  .srch .clr { font: 500 9px var(--m-font-mono); color: var(--m-text-faint); cursor:pointer; text-transform:uppercase; letter-spacing:.1em; padding:2px 5px; border:1px solid var(--m-border-subtle); border-radius:3px; }
  .srch .clr:hover { color: var(--accent); border-color: var(--m-border); }

  /* filter chips */
  .chips { display:flex; gap:5px; padding: 0 12px 10px; flex-wrap:wrap; border-bottom: 1px solid var(--m-border-subtle); }
  .chip { display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border:1px solid var(--m-border-subtle); border-radius: 9999px; font:500 10px var(--m-font-mono); text-transform:uppercase; letter-spacing:.08em; color: var(--m-text-muted); cursor:pointer; transition: all var(--m-dur-fast) var(--m-ease-out); user-select:none; }
  .chip:hover { color: var(--m-text); border-color: var(--m-border); }
  .chip.on { color: var(--accent); border-color: var(--m-border-strong); background: var(--m-fill-subtle); }
  .chip .n { font-size:9px; color: var(--m-text-faint); }
  .chip.on .n { color: var(--accent); }

  /* tree body (scrolling) */
  .exp-body { overflow:auto; padding: 6px 6px 14px; }

  /* quick access */
  .qa { margin-bottom: 6px; }
  .qa-h { display:flex; align-items:center; gap:7px; padding:6px 8px 4px; font:600 10px var(--m-font-mono); text-transform:uppercase; letter-spacing:.18em; color: var(--m-text-faint); cursor:pointer; user-select:none; }
  .qa-h:hover { color: var(--m-text-muted); }
  .qa-h .chev2 { transition: transform var(--m-dur-fast); color: var(--m-text-ghost); }
  .qa-h.closed .chev2 { transform: rotate(-90deg); }
  .qa-h .cnt { margin-left:auto; color: var(--m-text-ghost); }
  .sect-div { height:1px; background: var(--m-border-faint); margin: 8px 10px; }

  .row {
    display:flex; align-items:center; gap:8px;
    padding: var(--rowpad) 8px; margin: 1px 2px;
    border-radius: var(--m-radius-md);
    font: 500 12.5px var(--m-font-mono); color: var(--m-text-muted);
    cursor:pointer; border:1px solid transparent; user-select:none; white-space:nowrap;
  }
  .row:hover { background: var(--m-fill-subtle); color: var(--m-text); }
  .row:hover .star-btn, .row:hover .row-kind { opacity:1; }
  .row.on { background: var(--m-fill); color: var(--accent); border-color: var(--m-border); box-shadow: inset 2px 0 0 var(--accent); }
  .row .chev { width:12px; color: var(--m-text-ghost); flex:none; transition: transform var(--m-dur-fast); }
  .row.expanded .chev { transform: rotate(90deg); color: var(--accent); }
  .row.leaf .chev { visibility:hidden; }
  .row .ic { flex:none; color: var(--m-text-faint); display:grid; place-items:center; }
  .row.on .ic { color: var(--accent); }
  .row .nm { overflow:hidden; text-overflow:ellipsis; flex:1; }
  .row .nm mark { background: rgba(0,255,65,.22); color: var(--m-text-strong); border-radius:2px; padding:0 1px; }
  .row .row-kind { font-size:8.5px; letter-spacing:.1em; padding:1px 4px; border-radius:3px; opacity:.55; flex:none; }
  .row .badge { font-size:9px; color: var(--m-text-faint); padding:1px 6px; border:1px solid var(--m-border-subtle); border-radius:9999px; flex:none; }
  .row.on .badge { color: var(--accent); border-color: var(--m-border); }
  .row .star-btn { opacity:0; color: var(--m-text-ghost); flex:none; display:grid; place-items:center; transition: all var(--m-dur-fast); }
  .row .star-btn:hover { color: var(--m-warning); }
  .row .star-btn.pinned { opacity:1; color: var(--m-warning); }
  .row.dirty .nm::after { content:" ●"; color:#ffb347; }

  .exp-foot { border-top:1px solid var(--m-border-subtle); padding:8px 12px; display:flex; align-items:center; gap:14px; font:500 10px var(--m-font-mono); color: var(--m-text-faint); text-transform:uppercase; letter-spacing:.12em; }
  .exp-foot b { color: var(--accent); font-weight:600; }
  .exp-foot .flt { margin-left:auto; color: var(--m-warning); }

  /* collapsed rail */
  .exp.is-collapsed { grid-template-rows: auto 1fr; }
  .rail { display:flex; flex-direction:column; align-items:center; gap:10px; padding:12px 0; }
  .rail .vlabel { writing-mode: vertical-rl; transform: rotate(180deg); font:600 10px var(--m-font-mono); text-transform:uppercase; letter-spacing:.3em; color: var(--m-text-faint); margin-top:8px; }
  .rail .badge-n { font:500 10px var(--m-font-mono); color: var(--accent); border:1px solid var(--m-border); border-radius:9999px; padding:1px 6px; }

  /* ── command palette ───────────────────────────────────── */
  .pal-backdrop { position:fixed; inset:0; background: rgba(0,4,2,.62); backdrop-filter: blur(3px); z-index:60; display:grid; place-items:start center; padding-top:11vh; animation: fade .14s var(--m-ease-out); }
  @keyframes fade { from { opacity:0; } }
  .pal { width:min(640px,92vw); background: var(--m-panel); border:1px solid var(--m-border-strong); border-radius: var(--m-radius-xl); box-shadow: var(--m-shadow-3), var(--m-glow-md); overflow:hidden; animation: rise .18s var(--m-ease-out); }
  @keyframes rise { from { transform: translateY(-8px); opacity:0; } }
  .pal-in { display:flex; align-items:center; gap:11px; padding: 15px 18px; border-bottom:1px solid var(--m-border-subtle); }
  .pal-in input { flex:1; background:transparent; border:none; outline:none; color: var(--m-text-strong); font: 500 16px var(--m-font-mono); }
  .pal-in input::placeholder { color: var(--m-text-faint); }
  .pal-in .esc { font:600 10px var(--m-font-mono); padding:3px 7px; border:1px solid var(--m-border-subtle); border-radius:4px; color: var(--m-text-faint); }
  .pal-hint { padding:6px 18px; font:500 10px var(--m-font-mono); text-transform:uppercase; letter-spacing:.16em; color: var(--m-text-ghost); border-bottom:1px solid var(--m-border-faint); }
  .pal-list { max-height: 46vh; overflow:auto; padding:6px; }
  .pal-item { display:flex; align-items:center; gap:11px; padding:9px 12px; border-radius: var(--m-radius-md); cursor:pointer; border:1px solid transparent; }
  .pal-item .ic { flex:none; color: var(--m-text-faint); }
  .pal-item .nm { font:500 13.5px var(--m-font-mono); color: var(--m-text); }
  .pal-item .nm mark { background: rgba(0,255,65,.22); color: var(--m-text-strong); }
  .pal-item .pth { font:400 11px var(--m-font-mono); color: var(--m-text-faint); margin-left:auto; max-width:48%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pal-item .pk { font-size:8.5px; letter-spacing:.1em; padding:1px 5px; border-radius:3px; border:1px solid var(--m-border-subtle); flex:none; }
  .pal-item.sel { background: var(--m-fill); border-color: var(--m-border); }
  .pal-item.sel .ic, .pal-item.sel .nm { color: var(--accent); }
  .pal-empty { padding: 28px; text-align:center; color: var(--m-text-faint); font:500 12px var(--m-font-mono); }
  .pal-foot { display:flex; gap:18px; padding:9px 18px; border-top:1px solid var(--m-border-subtle); font:500 10px var(--m-font-mono); color: var(--m-text-ghost); }
  .pal-foot kbd { color: var(--m-text-faint); }

  /* ── preview pane ──────────────────────────────────────── */
  .pv { display:grid; grid-template-rows:auto auto auto 1fr auto; min-width:0; overflow:hidden; background: var(--m-bg); }
  .pv-top { display:flex; align-items:center; gap:12px; padding:11px 20px; border-bottom:1px solid var(--m-border-subtle); }
  .crumbs { font:500 10px var(--m-font-mono); text-transform:uppercase; letter-spacing:.2em; color: var(--m-text-faint); display:flex; align-items:center; gap:6px; min-width:0; overflow:hidden; }
  .crumbs .seg { color: var(--m-text-muted); cursor:pointer; }
  .crumbs .seg:hover { color: var(--m-text); }
  .crumbs .seg.cur { color: var(--accent); text-shadow: var(--m-text-glow); }
  .crumbs .sep { color: var(--m-text-ghost); }
  .pv-top .right { margin-left:auto; display:flex; align-items:center; gap:6px; }

  /* labeled action buttons */
  .act { display:inline-flex; align-items:center; gap:6px; height:28px; padding:0 11px; border-radius: var(--m-radius-md); border:1px solid var(--m-border); background: transparent; color: var(--m-text-muted); font:500 11px var(--m-font-mono); text-transform:uppercase; letter-spacing:.08em; cursor:pointer; transition: all var(--m-dur-fast) var(--m-ease-out); }
  .act:hover { border-color: var(--accent); color: var(--accent); background: var(--m-fill-subtle); }
  .act.primary { background: var(--accent); color: var(--m-bg); border-color: var(--accent); box-shadow: var(--m-glow-sm); }
  .act.primary:hover { background: var(--m-green-400); color: var(--m-bg); }
  .act.icon-only { padding:0; width:28px; justify-content:center; }
  .act.danger:hover { border-color: var(--m-danger); color: var(--m-danger); background: rgba(255,95,109,.1); }
  body[data-labels="off"] .act .t { display:none; }
  body[data-labels="off"] .act { padding:0; width:28px; justify-content:center; }

  /* overflow menu */
  .menu { position:absolute; top:42px; right:20px; z-index:40; min-width:184px; background: var(--m-panel); border:1px solid var(--m-border-strong); border-radius: var(--m-radius-lg); box-shadow: var(--m-shadow-2); padding:5px; }
  .menu button { display:flex; align-items:center; gap:10px; width:100%; padding:8px 10px; border:none; background:transparent; color: var(--m-text); font:500 12px var(--m-font-mono); cursor:pointer; border-radius: var(--m-radius-md); text-align:left; }
  .menu button:hover { background: var(--m-fill-subtle); color: var(--accent); }
  .menu button.danger { color: var(--m-danger); }
  .menu button.danger:hover { background: rgba(255,95,109,.1); }
  .menu .mdiv { height:1px; background: var(--m-border-faint); margin:4px 6px; }
  .menu .ic { color: var(--m-text-faint); }
  .menu button:hover .ic { color: currentColor; }

  .pv-meta { display:flex; align-items:center; gap:20px; padding:9px 20px; border-bottom:1px solid var(--m-border-subtle); font:500 10px var(--m-font-mono); color: var(--m-text-faint); text-transform:uppercase; letter-spacing:.14em; background: var(--m-bg-deep); }
  .pv-meta .kv b { color: var(--m-text-strong); font-weight:600; }
  .pv-meta .kv b.ok { color: var(--accent); }
  .pv-meta .sep { width:1px; height:13px; background: var(--m-border-subtle); }

  .pv-tabs { display:flex; align-items:stretch; border-bottom:1px solid var(--m-border-subtle); background: var(--m-panel); }
  .pv-tabs button { background:transparent; border:none; cursor:pointer; color: var(--m-text-muted); font:500 11px var(--m-font-mono); text-transform:uppercase; letter-spacing:.14em; padding:9px 14px; display:inline-flex; align-items:center; gap:7px; border-bottom:2px solid transparent; }
  .pv-tabs button:hover { color: var(--m-text); }
  .pv-tabs button.on { color: var(--accent); border-bottom-color: var(--accent); text-shadow: var(--m-text-glow); }
  .pv-tabs .grow { flex:1; }
  .pv-tabs .rgt { display:flex; align-items:center; gap:6px; padding:0 12px; }

  .pv-canvas { overflow:auto; background: var(--m-bg); position:relative; }

  .pill-kind { display:inline-flex; align-items:center; gap:5px; font:500 9.5px var(--m-font-mono); text-transform:uppercase; letter-spacing:.14em; padding:3px 8px; border:1px solid var(--m-border-subtle); border-radius:9999px; color: var(--m-text-muted); background: var(--m-bg-deep); }

  /* doc / code shells (preview) */
  .doc-shell { max-width: 860px; margin:0 auto; padding:28px 36px 60px; font:400 14.5px/1.7 var(--m-font-sans); color: var(--m-text); }
  .doc-shell h1 { font:600 28px var(--m-font-mono); color: var(--m-text-strong); letter-spacing:.03em; text-shadow: var(--m-text-glow); margin:0 0 6px; }
  .doc-shell h2 { font:600 18px var(--m-font-mono); color: var(--accent); letter-spacing:.04em; margin:28px 0 8px; padding-bottom:6px; border-bottom:1px solid var(--m-border-subtle); }
  .doc-shell h3 { font:600 14px var(--m-font-mono); color: var(--m-text-strong); margin:22px 0 6px; text-transform:uppercase; }
  .doc-shell p { margin:0 0 12px; }
  .doc-shell ul { margin:0 0 16px; padding-left:22px; }
  .doc-shell li { margin:4px 0; }
  .doc-shell li::marker { color: var(--accent); }
  .doc-shell strong { color: var(--m-text-strong); }
  .doc-shell code { font:500 13px var(--m-font-mono); padding:1px 5px; background: var(--m-bg-deep); border:1px solid var(--m-border-subtle); border-radius:3px; color:#d6ff5f; }
  .doc-shell pre { background:#02080d; border:1px solid var(--m-border); border-left:3px solid var(--accent); border-radius: var(--m-radius-md); padding:14px 16px; margin:12px 0 18px; font:500 12.5px/1.6 var(--m-font-mono); overflow:auto; }
  .doc-shell blockquote { border-left:2px solid var(--m-border); padding:6px 0 6px 14px; margin:12px 0; color: var(--m-text-muted); font-style:italic; }
  .doc-shell .lead { font-size:16px; color: var(--m-text-muted); border-left:2px solid var(--accent); padding:6px 0 6px 14px; margin:4px 0 22px; background: linear-gradient(90deg, rgba(0,255,65,.06), rgba(0,255,65,0)); }
  .doc-shell table { border-collapse:collapse; width:100%; margin:8px 0 16px; font:500 12.5px var(--m-font-mono); }
  .doc-shell th, .doc-shell td { border:1px solid var(--m-border-subtle); padding:8px 10px; text-align:left; }
  .doc-shell th { background: var(--m-bg-deep); color: var(--m-text-faint); text-transform:uppercase; font-size:10.5px; letter-spacing:.15em; width:170px; }

  .doc-wrap { display:grid; grid-template-columns: 1fr 220px; gap:24px; max-width:1120px; margin:0 auto; padding-right:24px; }
  .outline { position:sticky; top:28px; align-self:start; margin-top:32px; padding:14px 12px; border:1px solid var(--m-border-subtle); border-radius: var(--m-radius-md); background: var(--m-panel); font:500 11.5px var(--m-font-mono); }
  .outline h5 { margin:0 0 10px; font:600 10px var(--m-font-mono); text-transform:uppercase; letter-spacing:.22em; color: var(--m-text-faint); }
  .outline a { display:block; padding:4px 8px; border-radius:3px; color: var(--m-text-muted); text-decoration:none; border-left:2px solid transparent; line-height:1.45; }
  .outline a:hover { color: var(--m-text); background: var(--m-fill-subtle); }
  .outline a.on { color: var(--accent); background: var(--m-fill); border-left-color: var(--accent); }
  .outline a.h3 { padding-left:18px; font-size:11px; }

  .code-shell { display:grid; grid-template-columns:56px 1fr; font:500 12.5px/1.65 var(--m-font-mono); color: var(--m-text); background:#02080d; min-height:100%; }
  .code-shell .ln { text-align:right; padding:18px 12px 18px 0; color: var(--m-text-ghost); border-right:1px solid var(--m-border-subtle); user-select:none; font-size:11.5px; background: var(--m-bg-deep); }
  .code-shell .ln span { display:block; line-height:1.65; }
  .code-shell .src { padding:18px; white-space:pre; overflow-x:auto; }
  .code-shell .src .key { color:#5fcfff; } .code-shell .src .str { color:#d6ff5f; } .code-shell .src .com { color: var(--m-text-faint); font-style:italic; }

  .img-shell { display:grid; place-items:center; min-height:100%; padding:40px; }
  .img-ph { width:min(560px,80%); aspect-ratio:16/10; border:1px dashed var(--m-border); border-radius: var(--m-radius-lg); background: repeating-linear-gradient(45deg, var(--m-stripe) 0 10px, transparent 10px 20px); display:grid; place-items:center; color: var(--m-text-faint); font:500 11px var(--m-font-mono); text-transform:uppercase; letter-spacing:.14em; }

  .empty { display:grid; place-items:center; height:100%; color: var(--m-text-faint); font:500 12px var(--m-font-mono); text-align:center; }
  .empty .glyph { display:grid; place-items:center; margin:0 auto 12px; color: var(--m-text-ghost); }
  .empty .sub { color: var(--m-text-ghost); margin-top:6px; font-size:11px; }

  .pg-foot { border-top:1px solid var(--m-border); background: var(--m-sidebar); display:flex; align-items:center; gap:20px; padding:0 22px; height:30px; font:500 10px var(--m-font-mono); color: var(--m-text-faint); letter-spacing:.13em; text-transform:uppercase; }
  .pg-foot b { color: var(--m-text-strong); font-weight:600; }
  .pg-foot .sep { width:1px; height:13px; background: var(--m-border-subtle); }

  /* toast */
  .toast { position:fixed; bottom:46px; left:50%; transform:translateX(-50%); z-index:80; background: var(--m-panel); border:1px solid var(--m-border-strong); border-radius: var(--m-radius-md); padding:9px 16px; font:500 12px var(--m-font-mono); color: var(--accent); box-shadow: var(--m-shadow-2), var(--m-glow-sm); display:flex; align-items:center; gap:8px; animation: rise .18s var(--m-ease-out); }

  /* tweaks */
  .tw-fab { position:fixed; bottom:18px; right:18px; z-index:70; width:40px; height:40px; border-radius: var(--m-radius-md); display:grid; place-items:center; background: var(--m-panel); border:1px solid var(--m-border); color: var(--m-text-muted); cursor:pointer; box-shadow: var(--m-shadow-1); }
  .tw-fab:hover { color: var(--accent); border-color: var(--accent); }
  .tw-panel { position:fixed; bottom:66px; right:18px; z-index:70; width:262px; background: var(--m-panel); border:1px solid var(--m-border-strong); border-radius: var(--m-radius-lg); box-shadow: var(--m-shadow-3); padding:14px; }
  .tw-panel h4 { margin:0 0 12px; font:600 11px var(--m-font-mono); text-transform:uppercase; letter-spacing:.2em; color: var(--m-text-strong); display:flex; align-items:center; }
  .tw-panel h4 .x { margin-left:auto; cursor:pointer; color: var(--m-text-faint); }
  .tw-row { margin-bottom:13px; }
  .tw-row .l { font:600 9.5px var(--m-font-mono); text-transform:uppercase; letter-spacing:.16em; color: var(--m-text-faint); margin-bottom:6px; }
  .seg { display:flex; gap:4px; }
