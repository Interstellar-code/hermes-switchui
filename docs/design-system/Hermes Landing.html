<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="The terminal-native AI workspace where agents think, tools execute, and you stay in control. Open source. Self-hosted." />
  <title>Hermes Switch UI — Your Agents. One Workspace.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles/tokens.css" />
  <link rel="stylesheet" href="./styles/matrix-system.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: #020804;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    #root { min-height: 100vh; }

    /* Responsive grid fallback for feature cards */
    @media (max-width: 900px) {
      .hl-feat-grid { grid-template-columns: repeat(2, 1fr) !important; }
    }
    @media (max-width: 580px) {
      .hl-feat-grid { grid-template-columns: 1fr !important; }
    }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="./shared.jsx"          data-presets="react"></script>
  <script type="text/babel" src="./carousel.jsx"        data-presets="react"></script>
  <script type="text/babel" src="./hermes-landing.jsx"  data-presets="react"></script>

  <script type="text/babel" data-presets="react">
    ReactDOM.createRoot(document.getElementById('root')).render(
      <HermesLanding />
    );
  </script>
</body>
</html>
