# Hermes Switch UI + Agent — self-contained Docker Compose setup
#
# Requirements:
#   - Docker & Docker Compose
#   - At least one LLM provider key in .env (ANTHROPIC_API_KEY,
#     OPENAI_API_KEY, OPENROUTER_API_KEY, GOOGLE_API_KEY, …) OR a
#     reachable local server (Ollama, LM Studio, etc.) configured during
#     Hermes onboarding.
#
# Quick Start:
#   1. cp .env.example .env
#   2. Add at least one provider key and set HERMES_PASSWORD
#   3. docker compose up
#   4. Open http://localhost:3000
#
# Image:
#   The hermes-switchui image now self-contains the upstream Hermes Agent and
#   the Switch UI. The agent gateway runs inside the same container and the UI
#   connects to http://127.0.0.1:8642 over loopback.
#
# Persistent data:
#   The `claude-data` named volume mounts at /opt/data. Agent config,
#   sessions, skills, memory, credentials, and Switch UI runtime state live
#   there and survive container recreation.
#
# Troubleshooting:
#   - See README.md "Docker" troubleshooting section
#   - Check logs: docker compose logs hermes-switchui

services:
  hermes-switchui:
    image: ghcr.io/interstellar-code/hermes-switchui:latest
    env_file:
      - .env
    environment:
      # Agent gateway is supervised inside this same container.
      HERMES_API_URL: http://127.0.0.1:8642
      API_SERVER_ENABLED: 'true'
      API_SERVER_HOST: ${API_SERVER_HOST:-127.0.0.1}
      API_SERVER_KEY: ${API_SERVER_KEY:-}
      # Must match API_SERVER_KEY when the internal gateway auth is enabled.
      HERMES_API_TOKEN: ${API_SERVER_KEY:-}

      # Pass through provider keys for the bundled Hermes Agent.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}

      # Workspace session password. REQUIRED because the container binds the
      # web UI to 0.0.0.0 internally for Docker port publishing.
      HERMES_PASSWORD: ${HERMES_PASSWORD:-${CLAUDE_PASSWORD:-}}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      TRUST_PROXY: ${TRUST_PROXY:-}

      # Optional UID/GID remap for bind-mounted /opt/data, inherited from the
      # upstream Hermes Agent image.
      HERMES_UID: ${HERMES_UID:-}
      HERMES_GID: ${HERMES_GID:-}
      PUID: ${PUID:-}
      PGID: ${PGID:-}
    volumes:
      - claude-data:/opt/data
    ports:
      - '127.0.0.1:3000:3000'
      # Uncomment only when you intentionally want the agent API reachable from
      # the host. If you publish it beyond loopback, set a strong API_SERVER_KEY.
      # - '127.0.0.1:8642:8642'

volumes:
  claude-data:
