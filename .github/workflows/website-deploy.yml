name: Deploy website to VPS

# Build the Astro landing site (website/) in CI and rsync the result to the
# Virtualmin/Apache web root over SSH. Runs when the site, its lockfile, the
# root package version (drives the displayed site version), or this workflow
# changes on main — plus manual dispatch. Requires repo secrets:
# SSH_PRIVATE_KEY, SSH_HOST, SSH_PORT (opt), SSH_USER, DEPLOY_PATH.
#
# Runs on GitHub-hosted ubuntu-latest (the previous self-hosted runner is
# gone). The deploy target is a static web root — no Node service runs on the
# VPS, so the runner location doesn't matter.

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'package.json'
      - '.github/workflows/website-deploy.yml'
  workflow_dispatch:

# Never let two deploys race against the same web root.
concurrency:
  group: deploy-website-prod
  cancel-in-progress: true

defaults:
  run:
    working-directory: website

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.SSH_PORT || '22' }}" -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy dist/ to web root
        run: |
          # --no-times: skip mtime preservation. The deploy user is a member
          # of the web-root group (zionadmin) but not its owner, so rsync
          # can't update directory mtimes — without this flag, rsync exits
          # 23 (partial transfer) on every deploy. For a static site the
          # mtime is irrelevant; what matters is the file content.
          rsync -az --no-times --delete --exclude='.DS_Store' \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT || '22' }}" \
            dist/ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/"

      # The deploy SSH user is not the web-root owner (zionadmin) — it has
      # group write access and a sudoers entry to chown back to zionadmin.
      # Without this, files accumulate as deploy:deploy and Apache can still
      # serve them, but Virtualmin/panel-managed perms drift.
      - name: Restore web-root ownership
        if: success()
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.SSH_PORT || '22' }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "sudo /bin/chown -R zionadmin:zionadmin ${{ secrets.DEPLOY_PATH }}"

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
