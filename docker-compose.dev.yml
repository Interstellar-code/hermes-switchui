# Hermes Switch UI — Development Overlay
#
# Builds the self-contained image from local source instead of pulling the
# pre-built GHCR image. Use when iterating on Workspace code (server, routes,
# UI) and you want changes to land in the container without publishing first.
#
# The Dockerfile still uses the canonical upstream nousresearch/hermes-agent
# image as its runtime base, then copies the locally built Switch UI into it.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build

services:
  hermes-switchui:
    build:
      context: .
      dockerfile: ./Dockerfile
